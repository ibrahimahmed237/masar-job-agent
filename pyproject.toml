[project]
name = "masar"
version = "0.1.0"
description = "A personal job-hunt agent that cannot invent claims: collect postings, screen and score them, draft documents grounded in your own career file."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ibrahim Ahmed" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "httpx>=0.27",
  "typer>=0.12",
  "mcp>=2.0",
]

[project.scripts]
masar = "masar.cli.main:app"
masar-mcp = "masar.mcp_server.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masar"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "PIE", "T20"]
ignore = [
  "RUF001", # Arabic letters in strings are on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/masar/cli/*" = ["B008"] # Typer declares options as default arguments

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["masar"]

[tool.coverage.report]
show_missing = true
skip_covered = true
