name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      # The design promises that the domain stays at 95% of lines or more.
      - name: Domain coverage
        run: uv run coverage report --include "src/masar/domain/*" --fail-under 95
